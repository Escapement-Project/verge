[package]
name = "verge-gui"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_plot = "0.38.0"
humantime = "2.4.0"
pollster = "1.0.1"
rfd = "0.17.2"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
verge-probe = { version = "0.1.0", path = "../../verge-probe", features = ["capture"] }

[lints]
workspace = true

[features]
# `--simulate`, the simulated bench, for development with `--features simulate`; off in release
# builds. The tests take the simulator from verge-probe's dev-dependency below.
simulate = ["verge-probe/simulate"]

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
verge-probe = { path = "../../verge-probe", features = ["simulate"] }

[[bin]]
name = "verge-gui"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
dark-light = "3.0.0"
