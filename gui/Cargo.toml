[package]
name = "escapement-verge-gui"
edition.workspace = true
# The icons in icons/ are the project's marks, under CC BY 4.0.
license = "Apache-2.0 AND CC-BY-4.0"
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
humantime = "2.4.0"
pollster = "1.0.1"
rfd = "0.17.2"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
escapement-verge-probe = { version = "0.2.0", git = "https://github.com/Escapement-Project/verge-probe", features = ["tickwave"] }
escapement-tickwave-egui = { version = "0.1.0", git = "https://github.com/Escapement-Project/tickwave", tag = "v0.1.0" }
jiff = "1.0.1"

[lints]
workspace = true

[features]
# `--simulate`, the simulated bench, for development with `--features simulate`; off in release
# builds. The tests take the simulator from verge-probe's dev-dependency below.
simulate = ["escapement-verge-probe/simulate"]

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
escapement-verge-probe = { git = "https://github.com/Escapement-Project/verge-probe", features = ["simulate"] }

[[bin]]
name = "verge-gui"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
dark-light = "3.0.0"
zbus = "5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["UI_ViewManagement"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

[build-dependencies]
embed-resource = "3.0.12"
