[package]
name = "updater-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = "0.12.0"
indicatif = "0.18.6"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
updater-core = { version = "0.1.0", path = "../core" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[[bin]]
name = "verge-update"
path = "src/main.rs"
