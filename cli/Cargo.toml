[package]
name = "escapement-verge"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = "0.12.0"
humantime = "2.4.0"
indicatif = "0.18.6"
parse_int = "0.9.0"
ratatui = "0.30.2"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
escapement-verge-probe = { version = "0.1.0", git = "https://github.com/Escapement-Project/verge-probe", features = ["tickwave"] }
textwrap = { version = "0.16.4", default-features = false, features = ["std", "unicode-width"] }

[lints]
workspace = true

[features]
# `--simulate`, the simulated bench. On for the tests, through the dev-dependency below, and for
# development with `--features simulate`; off in release builds.
simulate = ["escapement-verge-probe/simulate"]

[dev-dependencies]
escapement-verge = { path = ".", features = ["simulate"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "verge"
path = "src/main.rs"

[target."cfg(unix)".dev-dependencies]
rexpect = "0.7.1"
