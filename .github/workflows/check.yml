# verge's own checks: rustfmt, clippy with warnings denied, the tests, a release build without
# the simulator, and the Windows build, compiled but not run.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, where these checks have been run. hidapi's build compiles C against libudev, and for
    # the Windows target it compiles that C with MinGW.
    container: archlinux:latest
    steps:
      - name: Install the toolchain
        run: >
          pacman -Syu --noconfirm --needed
          git gcc pkgconf systemd-libs mingw-w64-gcc rustup

      - uses: actions/checkout@v7

      - name: Install Rust, with the Windows target
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu

      # act has no Node in a job container; GitHub's runners mount one.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy, warnings denied
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Without --all-targets nothing turns the `simulate` feature on, as in a release build.
      - name: clippy as a release is built, without the simulator
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: A release build leaves the simulator out
        run: |
          if cargo tree --workspace --edges normal --invert minisign 2>/dev/null | grep -q minisign; then
            echo "a release build pulls in minisign, which only the simulator needs"
            exit 1
          fi
          cargo build --workspace
          # --help keeps the window shut; a build that knows --simulate accepts it and exits 0.
          for tool in verge verge-gui; do
            if ./target/debug/$tool --simulate bench --help > /dev/null; then
              echo "$tool, built as a release is, takes --simulate"
              exit 1
            fi
          done

      - name: Windows build, compiled only
        run: cargo check --workspace --all-targets --all-features --target x86_64-pc-windows-gnu
