[package]
name = "verge-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
hex = "0.4.3"
hidapi = "2.6.7"
humantime = "2.4.0"
minisign = { version = "0.10.0", optional = true }
minisign-verify = "0.3.0"
nusb = "0.2.8"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rblhost = "0.2.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
srec = "0.2.0"
thiserror = "2.0.21"
tracing = "0.1.44"
ureq = "3.4.2"

[lints]
workspace = true

[features]
# The simulated bench, `sim`, and the signing it needs. On for the tests, through the
# dev-dependency below, and for development with `--features simulate`; off in release builds.
simulate = ["dep:minisign"]

[dev-dependencies]
verge-core = { path = ".", features = ["simulate"] }
